<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>お支払い確認｜RHOボイトレ</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#173A5E; --navy-2:#0F2A46; --blue:#2E76B6; --sky:#EAF2FB; --bg:#F5F8FC;
    --paper:#FFFFFF; --text:#2B3A4A; --text-dim:#66788C; --line:#E1E8F0;
    --amber:#F5B84E; --data:#17A98D; --danger:#D9634E;
    --sans:"Zen Kaku Gothic New", sans-serif;
    --shadow: 0 16px 40px rgba(23,58,94,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    line-height:1.6; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center;
  }
  .wrap{max-width:480px; margin:0 auto; padding:20px 16px;}
  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:26px 20px; text-align:center; box-shadow:var(--shadow);
  }
  .spinner{
    width:34px; height:34px; margin:0 auto 16px; border-radius:50%;
    border:4px solid var(--sky); border-top-color:var(--data);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .status-title{font-size:17px; font-weight:900; color:var(--navy-2);}
  .status-sub{font-size:13px; color:var(--text-dim); margin-top:10px; line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <div class="status-title" id="statusTitle">お支払いを確認しています…</div>
    <p class="status-sub" id="statusSub">しばらくお待ちください</p>
  </div>
</div>
<script src="payment-complete.js?v=1"></script>
</body>
</html>
