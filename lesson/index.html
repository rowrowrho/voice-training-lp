<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#173A5E;
    --navy-2:#0F2A46;
    --blue:#2E76B6;
    --sky:#EAF2FB;
    --bg:#F5F8FC;
    --paper:#FFFFFF;
    --text:#2B3A4A;
    --text-dim:#66788C;
    --line:#E1E8F0;
    --amber:#F5B84E;
    --sans:"Zen Kaku Gothic New", sans-serif;
    --shadow: 0 16px 40px rgba(23,58,94,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    line-height:1.85; -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1040px; margin:0 auto; padding:0 24px;}
  h1,h2,h3{font-weight:900; letter-spacing:0.01em;}
  .mark{background:linear-gradient(transparent 62%, rgba(245,184,78,0.55) 0);}

  /* ---------- nav ---------- */
  header.nav{
    position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.9);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  }
  .nav-inner{display:flex; align-items:center; justify-content:space-between; padding:10px 24px; max-width:1040px; margin:0 auto;}
  .brand{font-weight:900; font-size:17px; color:var(--navy);}
  .btn-cta{
    display:inline-flex; align-items:center; gap:8px; background:var(--navy); color:#fff;
    font-weight:700; font-size:13.5px; padding:11px 20px; border-radius:10px;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn-cta:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(23,58,94,0.28);}
  .plane{width:15px; height:15px; flex-shrink:0;}
  .nav-back{
    font-size:13px; font-weight:700; color:var(--navy); padding:8px 14px; border-radius:10px;
    border:1px solid var(--line); white-space:nowrap;
  }
  .nav-back:hover{background:var(--sky);}
  @media (max-width:480px){ .nav-back{display:none;} }

  /* ---------- hero ---------- */
  .hero{padding:52px 0 8px; text-align:center;}
  .eyebrow-pill{
    display:inline-block; background:var(--navy); color:#fff; font-size:12.5px; font-weight:700;
    padding:7px 16px; border-radius:100px; letter-spacing:0.04em; margin-bottom:20px;
  }
  .hero h1{font-size:clamp(26px,3.4vw,36px); line-height:1.5; color:var(--navy);}
  .hero-sub{margin:18px auto 0; max-width:560px; font-size:15px; color:var(--text-dim); line-height:1.9;}

  /* ---------- videos ---------- */
  .videos{padding:36px 0 56px;}
  .video-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:22px;
    max-width:900px; margin:0 auto;
  }
  .video-card{
    background:var(--paper); border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .video-card video{display:block; width:100%; background:#000; aspect-ratio:16/9;}
  .video-card.portrait video{aspect-ratio:9/16; max-height:70vh; margin:0 auto;}
  .video-body{padding:16px 20px 20px;}
  .video-no{
    display:inline-block; background:var(--sky); color:var(--navy); font-size:11.5px; font-weight:900;
    padding:3px 12px; border-radius:100px; margin-bottom:8px; letter-spacing:0.04em;
  }
  .video-body h3{font-size:16px; color:var(--navy); line-height:1.6;}
  .video-body p{margin-top:6px; font-size:13px; color:var(--text-dim); line-height:1.8;}
  .empty-note{
    display:none; max-width:560px; margin:0 auto; text-align:center; font-size:14px; color:var(--text-dim);
    background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:28px 20px;
  }

  /* ---------- notes ---------- */
  .note-box{
    max-width:900px; margin:0 auto 56px; background:var(--paper); border:1px solid var(--line);
    border-left:5px solid var(--amber); border-radius:12px; padding:18px 22px;
    font-size:13px; color:var(--text-dim); line-height:1.9;
  }
  .note-box strong{color:var(--navy);}

  /* ---------- closing ---------- */
  .closing{
    background:linear-gradient(135deg,var(--navy-2),var(--navy)); color:#fff; text-align:center;
    padding:60px 0;
  }
  .closing h2{font-size:clamp(20px,2.6vw,26px); line-height:1.6;}
  .closing p{margin-top:12px; font-size:14px; color:#B9C7D6;}
  .closing .btn-cta{margin-top:24px; background:#fff; color:var(--navy);}

  footer{padding:30px 0; text-align:center;}
  footer p{font-size:12px; color:var(--text-dim);}
  footer .back-top{display:inline-block; margin-bottom:12px; font-size:13px; font-weight:700; color:var(--navy); border-bottom:1.5px solid var(--navy); padding-bottom:1px;}
  a:focus-visible, video:focus-visible{ outline:2px solid var(--blue); outline-offset:3px; }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <div class="brand">RHO ボイトレ</div>
    <div style="display:flex; align-items:center; gap:10px;">
      <a class="nav-back" href="../">← ボイトレLPへ</a>
      <a class="btn-cta" href="../consult/" data-consult="cta_lesson_nav">
        <svg class="plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        相談する
      </a>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <span class="eyebrow-pill">LESSON</span>
    <h1>実際の<span class="mark">レッスンの様子</span></h1>
    <p class="hero-sub">どんな雰囲気で進むのか、動画でそのままご覧ください。</p>
  </div>
</section>

<section class="videos">
  <div class="wrap">
    <div class="video-grid" id="videoGrid"></div>
    <p class="empty-note" id="emptyNote">動画を準備中です。しばらくお待ちください。</p>
  </div>
</section>

<div class="wrap">
  <div class="note-box">
    <strong>動画について</strong><br>
    <span id="consentLine">掲載している動画は、ご本人の同意を得たものです。<br></span>
    音が出ますので、周りの環境にご注意ください。
  </div>
</div>

<section class="closing">
  <div class="wrap">
    <h2>雰囲気がわかったら、<br>まずは気軽にご相談ください</h2>
    <p>いまの悩みを聞いて、何から練習するかを一緒に整理します。</p>
    <a class="btn-cta" href="../consult/" data-consult="cta_lesson_closing">相談する →</a>
  </div>
</section>

<footer>
  <a class="back-top" href="../">← ボイトレLPに戻る</a>
  <p>© RHOボイトレ / Reveal Hidden Opportunities</p>
</footer>

<script>
  // ===== 動画リスト（ここだけ編集すればOK） =====
  // src      : 動画ファイル（lesson/movie/ の中のファイル名）
  // title    : 見出し（空にすると「レッスンの様子 N」になる）
  // note     : 説明文（空なら表示しない）
  // portrait : 縦動画なら true
  var VIDEOS = [
    { src: 'movie/lesson01.mp4', title: '', note: '', portrait: false },
    { src: 'movie/lesson02.mp4', title: '', note: '', portrait: false },
    { src: 'movie/lesson03.mp4', title: '', note: '', portrait: false }
  ];

  // 「ご本人の同意を得たもの」の一文：同意が取れている動画だけの時 true／それ以外は false
  var SHOW_CONSENT_LINE = false;
  if(!SHOW_CONSENT_LINE){ var cl=document.getElementById('consentLine'); if(cl) cl.parentNode.removeChild(cl); }

  var grid = document.getElementById('videoGrid');
  var emptyNote = document.getElementById('emptyNote');
  var shown = 0;
  var pending = VIDEOS.length;

  function checkEmpty(){
    pending--;
    if(pending <= 0 && shown === 0){ emptyNote.style.display = 'block'; }
  }

  VIDEOS.forEach(function(v, i){
    var card = document.createElement('div');
    card.className = 'video-card' + (v.portrait ? ' portrait' : '');
    card.style.display = 'none';

    var video = document.createElement('video');
    video.setAttribute('controls', '');
    video.setAttribute('playsinline', '');
    video.setAttribute('preload', 'metadata');
    video.src = v.src + '#t=0.1';

    var body = document.createElement('div');
    body.className = 'video-body';
    var no = document.createElement('span');
    no.className = 'video-no';
    no.textContent = 'VIDEO ' + (i + 1);
    var h = document.createElement('h3');
    h.textContent = v.title ? v.title : 'レッスンの様子 ' + (i + 1);
    body.appendChild(no);
    body.appendChild(h);
    if(v.note){
      var p = document.createElement('p');
      p.textContent = v.note;
      body.appendChild(p);
    }

    card.appendChild(video);
    card.appendChild(body);
    grid.appendChild(card);

    var done = false;
    video.addEventListener('loadedmetadata', function(){
      if(done) return; done = true;
      card.style.display = '';
      shown++;
      checkEmpty();
    });
    video.addEventListener('error', function(){
      if(done) return; done = true;
      checkEmpty();
    });
    video.addEventListener('play', function(){
      if(window.gtag) gtag('event', 'lesson_video_play', { video_no: i + 1 });
    });
  });
</script>
</body>
</html>
